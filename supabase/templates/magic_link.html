<!doctype html>
<html>
  <body style="margin:0;padding:32px;background:#fbf9f4;font-family:Georgia,'Times New Roman',serif;color:#1a1713">
    <table role="presentation" style="max-width:420px;margin:0 auto">
      <tr><td>
        <p style="margin:0 0 28px;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:#9c9184">Muscle Mommy</p>

        <p style="margin:0 0 8px;font-size:17px">Your sign-in code</p>
        <p style="margin:0 0 28px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:38px;font-weight:600;letter-spacing:0.16em;color:#8a6b33">{{ .Token }}</p>

        <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#6e655b">
          Type it into the tab you started from. It expires in an hour.
        </p>

        <p style="margin:0;font-size:14px;line-height:1.6;color:#9c9184">
          Or <a href="{{ .ConfirmationURL }}" style="color:#8a6b33">open this link</a> instead. If you did not ask for this, ignore it.
        </p>
      </td></tr>
    </table>
  </body>
</html>
